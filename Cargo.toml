[package]
name = "avrogen"
version = "0.4.2"
authors = ["polo-asm"]
edition = "2021"
license = "MIT"
# license-file = "LICENSE"
description = "This program allow allow to generate rust code from avro definition files. Modules are created from namespace information"
homepage = "https://github.com/polo-asm/avrogen"
repository= "https://github.com/polo-asm/avrogen"
readme= "Readme.md"
keywords = ["avro", "code-generation", "cli", "serde" ]
categories = ["command-line-utilities", "development-tools::build-utils" ]

[dependencies]
apache-avro = { version = "0.22.0" }
serde = { version = "1.0" }
heck = "0.5.0"
derive_more = { version = "2.1", features = ["from"] }
serde_json = "1.0.151"
clap = { version = "4.6.6", features = ["derive"] }
log = { version = "0.4.34", features = ["max_level_debug","release_max_level_debug"] }
colog = "1.4.0"
clap-verbosity = "2.1.0"
glob = "0.3.4"
itertools = "0.15"
indent = "0.1.1"
reqwest ={ version = "0.13", features = ["json","blocking"], optional = true }

[dev-dependencies]
walkdir = "2.5.0"

[profile.dev]
opt-level = 0
debug = true
debug-assertions = true
overflow-checks = true

[features]
default = ["schema_registry"]
schema_registry = ["dep:reqwest"]
